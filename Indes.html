<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image en Vidéo (avec prompt)</title>
<style>
  body { background:#111; color:#fff; font-family:sans-serif; padding:15px; }
  input, button, textarea { width:100%; padding:12px; margin-bottom:10px; font-size:14px; box-sizing:border-box; }
  button { background:#e87b35; color:#fff; border:none; font-weight:bold; font-size:16px; }
  #out { background:#000; color:#0f0; padding:10px; font-family:monospace; white-space:pre-wrap; font-size:12px; min-height:150px; }
</style>
</head>
<body>
<input type="text" id="key" placeholder="Ta clé API (sk-...)">
<input type="text" id="img" placeholder="Colle l'URL de l'image ici">
<textarea id="prompt" placeholder="Décris le mouvement (ex: le vent souffle, la personne sourit...)">Anime doucement cette image</textarea>
<button id="btn">ANIMER L'IMAGE EN VIDÉO</button>
<div id="out">En attente...</div>

<script>
document.getElementById('btn').onclick = async () => {
  const key = document.getElementById('key').value.trim();
  const imgUrl = document.getElementById('img').value.trim();
  const monPrompt = document.getElementById('prompt').value.trim(); // On récupère le texte tapé
  const out = document.getElementById('out');
  
  out.style.color = '#ff0';
  out.textContent = "Envoi à l'API... (si file pleine, attente auto)";

  for (let i = 0; i < 15; i++) {
    try {
      let res = await fetch("https://apihub.agnes-ai.com/v1/videos", {
        method: "POST",
        headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "agnes-video-2.5-flash",
          prompt: monPrompt, // <--- On utilise le texte de la case
          seconds: "4",
          size: "720P",
          aspect_ratio: "16:9",
          mode: "keyframe",
          first_frame: imgUrl
        })
      });
      
      // ... (le reste du code est identique)
