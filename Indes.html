<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Video</title>
<style>
body { background: #000; color: #fff; font-family: sans-serif; padding: 10px; }
input, button { width: 100%; padding: 15px; margin: 5px 0; box-sizing: border-box; }
button { background: #ff4500; color: white; font-weight: bold; border: none; }
#log { background: #111; color: #00ff00; padding: 10px; height: 200px; overflow-y: scroll; font-family: monospace; }
video { width: 100%; margin-top: 10px; }
</style>
</head>
<body>

<input type="text" id="key" placeholder="Colle ta clé sk- ici">
<button onclick="lancer()">LANCER</button>
<div id="log">Prêt.</div>
<div id="resultat"></div>

<script>
function afficher(texte) {
    document.getElementById("log").innerHTML += "<br>> " + texte;
}

async function lancer() {
    // On récupère la clé SANS la modifier
    var cle = document.getElementById("key").value.trim();
    
    if(cle.length < 10) { return alert("Clé invalide"); }

    document.getElementById("log").innerHTML = "Démarrage...";

    try {
        afficher("Envoi...");
        
        var corps = JSON.stringify({
            model: "agnes-video-v2.0",
            prompt: "A cute kitten, cinematic",
            num_frames: 121,
            frame_rate: 24
        });

        var maRequete = new Request("https://apihub.agnes-ai.com/v1/videos", {
            method: "POST",
            body: corps
        });

        // On ajoute la clé exactement comme le demande la doc
        maRequete.headers.append("Authorization", "Bearer " + cle);
        maRequete.headers.append("Content-Type", "application/json");

        var reponse = await fetch(maRequete);

        if(!reponse.ok) throw new Error("Erreur API: " + reponse.status);

        var data = await reponse.json();
        var id = data.video_id || data.id;
        
        afficher("Tâche OK: " + id);
        afficher("Attente...");

        for(var i = 0; i < 50; i++) {
            await new Promise(r => setTimeout(r, 5000));
            
            var maPoll = new Request("https://apihub.agnes-ai.com/agnesapi?video_id=" + id + "&model_name=agnes-video-v2.0");
            maPoll.headers.append("Authorization", "Bearer " + cle);

            var resPoll = await fetch(maPoll);
            var info = await resPoll.json();
            
            afficher(info.status + " - " + (info.progress || 0) + "%");

            if(info.status === "completed" || info.status === "succeeded") {
                var url = info.metadata.url || info.url;
                document.getElementById("resultat").innerHTML = '<video src="' + url + '" controls autoplay loop></video>';
                afficher("FINI !");
                return;
            }
        }
    } catch(e) {
        afficher("ERREUR: " + e.message);
    }
}
</script>
</body>
</html>
