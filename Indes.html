<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinema Studio AI</title>
<style>
body { background: #0a0a12; color: #e8e6e0; font-family: sans-serif; padding: 1rem; }
.panel { background: #16161f; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; border: 1px solid #333; }
button { width: 100%; padding: 1rem; background: #e87b35; color: white; border: none; border-radius: 6px; font-weight: bold; margin-top: 10px; cursor: pointer; }
textarea { width: 100%; padding: 0.5rem; background: #000; color: #0f0; border: 1px solid #333; font-family: monospace; }
#log-box { background: #000; color: #0f0; font-family: monospace; font-size: 0.8rem; height: 200px; overflow-y: auto; padding: 0.5rem; border: 1px solid #333; margin-top: 1rem; }
video { width: 100%; margin-top: 1rem; border-radius: 6px; }
</style>
</head>
<body>

<h1>Cinema Studio AI</h1>

<div class="panel">
    <label>Clé API :</label>
    <input type="text" id="api-key" style="width:100%; padding:0.8rem; margin-top:5px; margin-bottom:10px; background:#000; color:white; border:1px solid #333;" placeholder="sk-...">
    <button onclick="start()">▶ GÉNÉRER LA VIDÉO</button>
</div>

<div id="log-box">Prêt.</div>
<div id="video-container"></div>

<script>
const API_BASE = 'https://apihub.agnes-ai.com/v1';
const POLL_BASE = 'https://apihub.agnes-ai.com/agnesapi';
const MODEL = 'agnes-video-v2.0';

function log(msg) {
    const box = document.getElementById('log-box');
    box.innerHTML += '<br>> ' + msg;
    box.scrollTop = box.scrollHeight;
}

// Fonction magique pour éviter le bug des caractères invisibles du téléphone
function cleanString(str) {
    if (!str) return "";
    return str.replace(/[^\x20-\x7E]/g, '').trim();
}

async function start() {
    const rawKey = document.getElementById('api-key').value;
    const key = cleanString(rawKey);
    
    if (key.length < 5) {
        alert("Mets une vraie clé API !");
        return;
    }

    document.getElementById('log-box').innerHTML = "Démarrage...";
    document.getElementById('video-container').innerHTML = "";

    try {
        log("Envoi de la demande à l'IA...");
        
        // On construit la requête SANS utiliser "Headers" pour éviter le bug
        const reqBody = JSON.stringify({
            model: MODEL,
            prompt: "A beautiful cinematic shot of a kitten wearing a retro space helmet, Wes Anderson style, pastel colors.",
            num_frames: 121,
            frame_rate: 24
        });

        // Requête 1 : Création
        const res = await fetch(API_BASE + '/videos', {
            method: 'POST',
            body: reqBody,
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + key
            }
        });

        if (!res.ok) throw new Error("Erreur création: " + res.status);
        
        const data = await res.json();
        const videoId = data.video_id || data.id;
        log("Tâche créée ! ID: " + videoId);
        log("Attente de la génération (1 à 2 minutes)...");

        // Requête 2 : Attente
        let urlFinale = null;
        for(let i=0; i<50; i++) {
            await new Promise(r => setTimeout(r, 5000)); // attend 5 sec
            
            const resPoll = await fetch(POLL_BASE + '?video_id=' + videoId + '&model_name=' + MODEL, {
                method: 'GET',
                headers: {
                    "Authorization": "Bearer " + key
                }
            });
            
            const dataPoll = await resPoll.json();
            log("Statut: " + (dataPoll.status || "en cours") + " - " + (dataPoll.progress || 0) + "%");
            
            if (dataPoll.status === 'completed' || dataPoll.status === 'succeeded') {
                urlFinale = dataPoll.metadata?.url || dataPoll.url;
                break;
            }
            if (dataPoll.status === 'failed' || dataPoll.status === 'error') {
                throw new Error("L'IA a échoué.");
            }
        }

        if (urlFinale) {
            log("✅ VIDÉO PRÊTE !");
            document.getElementById('video-container').innerHTML = '<video src="' + urlFinale + '" controls autoplay loop></video>';
        } else {
            throw new Error("Temps d'attente dépassé.");
        }

    } catch (e) {
        log("❌ Erreur : " + e.message);
    }
}
</script>

</body>
</html>
