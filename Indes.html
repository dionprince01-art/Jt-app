<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test API Agnes - Diagnostic</title>
<style>
    body { background: #111; color: #fff; font-family: sans-serif; padding: 20px; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; font-size: 16px; }
    button { width: 100%; padding: 15px; background: #ff4500; color: white; border: none; font-size: 18px; font-weight: bold; }
    #console { background: #000; color: #00ff00; padding: 15px; margin-top: 20px; font-family: monospace; white-space: pre-wrap; min-height: 200px; border: 1px solid #333; font-size: 14px; word-break: break-all; }
</style>
</head>
<body>

<!-- 01. Champ pour la clé API -->
<input type="text" id="cle-api" placeholder="Colle ta clé API ici (sk-...)">

<!-- 02. Bouton pour lancer le test -->
<button id="bouton-test">LANCER LE TEST</button>

<!-- 03. La zone noire où s'affichera l'erreur exacte -->
<div id="console">En attente...</div>

<script>
// 04. On écoute le clic sur le bouton
document.getElementById('bouton-test').addEventListener('click', async () => {
    
    // 05. On récupère la clé entrée par l'utilisateur
    const maCle = document.getElementById('cle-api').value.trim();
    
    // 06. On récupère la zone d'affichage
    const zoneConsole = document.getElementById('console');

    // 07. Vérification de base
    if(!maCle.startsWith('sk-')) {
        zoneConsole.style.color = '#ff4444';
        zoneConsole.textContent = "Erreur : La clé ne commence pas par sk-";
        return;
    }

    // 08. On affiche que la requête commence
    zoneConsole.style.color = '#ffff00';
    zoneConsole.textContent = "Envoi de la requête à l'API Agnes...\nPatientez quelques secondes...";

    try {
        // 09. On prépare la requête avec les paramètres MINIMAUX recommandés
        const reponse = await fetch("https://apihub.agnes-ai.com/v1/videos", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + maCle,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                "model": "agnes-video-v2.0",
                "prompt": "Un chat qui marche sur une plage au coucher du soleil",
                "width": 1152,
                "height": 768,
                "num_frames": 121,  // <-- On utilise 121 qui est valide (8*15+1)
                "frame_rate": 24
            })
        });

        // 10. On lit la réponse du serveur
        const donnees = await reponse.json();

        // 11. Si ça marche (code 200)
        if (reponse.ok) {
            zoneConsole.style.color = '#00ff00';
            zoneConsole.textContent = "✅ SUCCÈS TOTAL !\n\nVoici la réponse du serveur :\n" + JSON.stringify(donnees, null, 2);
        } 
        // 12. Si ça plante (code 400, 401, 500, etc.)
        else {
            zoneConsole.style.color = '#ff4444';
            zoneConsole.textContent = "❌ ERREUR " + reponse.status + "\n\nVoici EXACTEMENT ce que le serveur Agnes a répondu :\n\n" + JSON.stringify(donnees, null, 2);
        }

    } catch (erreur) {
        // 13. Si le téléphone n'arrive pas à contacter internet
        zoneConsole.style.color = '#ff4444';
        zoneConsole.textContent = "❌ Erreur réseau : " + erreur.message;
    }
});
</script>

</body>
</html>
