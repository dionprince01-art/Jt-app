<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Video</title>
<style>
body { background: #000; color: #fff; font-family: sans-serif; padding: 10px; }
input, button { width: 100%; padding: 15px; margin: 5px 0; box-sizing: border-box; border-radius: 5px; }
button { background: #ff4500; color: white; font-weight: bold; border: none; }
#log { background: #111; color: #00ff00; padding: 10px; height: 200px; overflow-y: scroll; font-family: monospace; margin-top: 10px; }
video { width: 100%; margin-top: 10px; border-radius: 5px; }
</style>
</head>
<body>

<h2>Génération Vidéo</h2>
<input type="text" id="key" placeholder="Colle ta clé sk- ici">
<button onclick="lancer()">LANCER LA GÉNÉRATION</button>
<div id="log">Prêt.</div>
<div id="resultat"></div>

<script>
function afficher(texte) {
    var zone = document.getElementById("log");
    zone.innerHTML = zone.innerHTML + "<br>> " + texte;
    zone.scrollTop = zone.scrollHeight;
}

async function lancer() {
    // On récupère la clé et on supprime TOUS les caractères invisibles
    var cle = document.getElementById("key").value;
    cle = cle.replace(/[^\x20-\x7E]/g, '').trim(); 
    
    if(cle.length < 10) {
        alert("Clé invalide");
        return;
    }

    document.getElementById("log").innerHTML = "Démarrage...";
    document.getElementById("resultat").innerHTML = "";

    try {
        afficher("Envoi de la demande...");
        
        // On utilise une méthode simple sans "Headers"
        var maRequete = {
            method: "POST",
            body: JSON.stringify({
                model: "agnes-video-v2.0",
                prompt: "A cute kitten in a spacesuit, cinematic, pastel colors",
                num_frames: 121,
                frame_rate: 24
            })
        };
        
        var lesOptions = Object.assign({}, maRequete, {
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + cle
            }
        });

        var reponse = await fetch("https://apihub.agnes-ai.com/v1/videos", lesOptions);

        if(!reponse.ok) {
            throw new Error("Erreur " + reponse.status);
        }

        var resultat = await reponse.json();
        var idVideo = resultat.video_id || resultat.id;
        
        afficher("Tâche créée : " + idVideo);
        afficher("Attente de la création...");

        var lienFinal = null;

        for(var i = 0; i < 60; i++) {
            await new Promise(r => setTimeout(r, 5000));
            
            var reponseAttente = await fetch("https://apihub.agnes-ai.com/agnesapi?video_id=" + idVideo + "&model_name=agnes-video-v2.0", {
                headers: {
                    "Authorization": "Bearer " + cle
                }
            });
            
            var infos = await reponseAttente.json();
            var statut = infos.status || "en cours";
            var pourcentage = infos.progress || 0;
            
            afficher(statut + " - " + pourcentage + "%");

            if(statut === "completed" || statut === "succeeded") {
                lienFinal = infos.metadata.url || infos.url;
                break;
            }
            if(statut === "failed" || statut === "error") {
                throw new Error("Echec de l'IA.");
            }
        }

        if(lienFinal) {
            afficher("SUCCÈS !");
            document.getElementById("resultat").innerHTML = '<video src="' + lienFinal + '" controls autoplay loop></video>';
        } else {
            throw new Error("Temps écoulé.");
        }

    } catch(e) {
        afficher("ERREUR : " + e.message);
    }
}
</script>
</body>
</html>
