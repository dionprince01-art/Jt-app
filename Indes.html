<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#111;color:#fff;font-family:sans-serif;padding:10px}input,button{width:100%;padding:12px;margin:5px 0;box-sizing:border-box;font-size:16px}button{background:#e87b35;color:#fff;border:none;font-weight:bold}#out{background:#000;color:#0f0;padding:10px;font-family:monospace;white-space:pre-wrap;font-size:12px}</style>
</head><body>
<input type="text" id="k" placeholder="Colle ta clé ici (sk-...)">
<button id="b">GÉNÉRER UNE IMAGE</button>
<div id="out">En attente...</div>
<script>
document.getElementById('b').onclick = async () => {
  const key = document.getElementById('k').value.trim(), out = document.getElementById('out');
  out.textContent = "Génération en cours...";
  try {
    let r = await fetch("https://apihub.agnes-ai.com/v1/images/generations", {
      method: "POST", headers: { "Authorization": "Bearer " + key, "Content-Type": "application/json" },
      body: JSON.stringify({ model: "agnes-image-2.5-flash", prompt: "Un chat mignon dans un style Wes Anderson, pastel", size: "1K", ratio: "16:9" })
    });
    let d = await r.json();
    if (r.ok) {
      out.style.color = '#0f0'; out.textContent = "✅ Image prête !\n\nLien :\n" + (d.data?.[0]?.url || "Erreur: pas d'URL");
    } else {
      out.style.color = '#f44'; out.textContent = "❌ Erreur: " + JSON.stringify(d);
    }
  } catch(e) { out.style.color = '#f44'; out.textContent = "❌ " + e.message; }
};
</script>
</body></html>
